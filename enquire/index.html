<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Send an enquiry to Gesch Town Planning and Project Management.">
  <link rel="canonical" href="https://geschdevelopments.com.au/enquire/">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/landing.css">
  <title>Send an enquiry | Gesch Town Planning</title>
</head>
<body>
  <header class="site-header simple-header"><a class="brand" href="/" aria-label="Gesch Town Planning home"><img src="/assets/gesch-town-planning-logo.png" alt="Gesch Town Planning and Project Management"></a></header>
  <main id="main-content"><section class="section section-ink form-section standalone-form"><div><p class="eyebrow light">Start an enquiry</p><h1>Tell us what you are planning.</h1><p>Share a few details about your property and what you are hoping to achieve. We will review your enquiry before getting in touch.</p></div><form class="enquiry-form" data-enquiry-form data-form-name="Website enquiry" novalidate><input type="hidden" name="form_name" value="Website enquiry"><div class="honeypot" aria-hidden="true"><label>Leave this blank<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div><div class="form-grid"><label>Full name<input required name="name" autocomplete="name"></label><label>Email address<input required type="email" name="email" autocomplete="email"></label><label>Phone number<input required type="tel" name="phone" autocomplete="tel"></label><label>Queensland council or postcode<input required name="council_or_postcode"></label><label>What are you considering?<select required name="service"><option value="">Select one</option><option>Multi-generational living</option><option>Tiny home</option><option>Dual occupancy or granny flat</option><option>Subdivision</option><option>Other</option></select></label></div><label>Tell us a little about the property and your idea<textarea required name="message" rows="6"></textarea></label><label class="checkbox"><input required type="checkbox" name="privacy_consent"><span>I understand that my details will be used to respond to this enquiry.</span></label><button class="button button-stone" type="submit">Send my enquiry</button><p class="form-message" data-form-message aria-live="polite"></p></form></section></main>
  <script src="/assets/config.js"></script><script src="/assets/site.js"></script>
</body>
</html>
